services:
  helixblast:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/etc/helixblast/config.yaml:ro
      - ./databases.yaml:/etc/helixblast/databases.yaml:ro
      - helixblast_data:/data
      - /var/blast/db:/var/blast/db:ro
    environment:
      - TZ=UTC
    restart: unless-stopped

volumes:
  helixblast_data:
